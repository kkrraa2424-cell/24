<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#222;display:flex;justify-content:center;align-items:center;padding:18px}
.card{width:min(620px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #0001}
h1{text-align:center;margin:0 0 18px;font-size:28px}
textarea{width:100%;min-height:150px;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:18px;outline:none;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
button{border:0;border-radius:12px;padding:13px;font-size:16px;background:#eee;cursor:pointer}
button.main{background:#222;color:#fff}
.result{margin-top:15px;background:#f7f7f7;border-radius:14px;padding:15px;min-height:70px;font-size:20px;white-space:pre-wrap;word-break:break-word}
.note{font-size:12px;color:#777;text-align:center;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<h1>24</h1>
<textarea id="input" placeholder="اكتب هنا..."></textarea>
<div class="row">
<button class="main" onclick="encodeText()">تحويل</button>
<button onclick="decodeText()">إظهار</button>
<button onclick="copyResult()">نسخ</button>
<button onclick="clearAll()">مسح</button>
</div>
<div id="result" class="result"></div>
<div class="note">تعمل الصفحة مباشرة في المتصفح.</div>
</main>
<script>
const map={
"ا":"2324","ب":"3745","ت":"1417","ث":"2633","ج":"2034","ح":"4556","خ":"1721",
"د":"3541","ذ":"1112","ر":"2935","ز":"4256","س":"1923","ش":"2835","ص":"2631",
"ض":"4750","ط":"1620","ظ":"2932","ع":"3841","غ":"1115","ف":"3944","ق":"2326",
"ك":"3136","ل":"4550","م":"1517","ن":"3440","هـ":"2124","و":"4135","ي":"2731"
};
const reverse=Object.fromEntries(Object.entries(map).map(([k,v])=>[v,k]));
const input=document.getElementById("input"), result=document.getElementById("result");

function encodeText(){
  result.textContent=[...input.value].map(c=>c===" " ? "/" : (map[c]||c)).join(" ");
}
function decodeText(){
  result.textContent=input.value.trim().split(/\s+/).map(x=>x==="/"?" ":(reverse[x]||x)).join("");
}
async function copyResult(){
  try{await navigator.clipboard.writeText(result.textContent)}catch(e){}
}
function clearAll(){input.value="";result.textContent=""}
</script>
</body>
</html>
